[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biosbom-agentkg"
version = "0.4.1"
description = "Evidence-checked multi-agent triage for bioinformatics software supply chains"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "packaging>=24,<27", "semver>=3,<4"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "ruff>=0.5,<1", "httpx>=0.27,<1"]

[project.scripts]
biosbom-agentkg = "biosbom_agentkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biosbom_agentkg = ["web/static/*", "web/fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
