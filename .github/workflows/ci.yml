name: Validate package and offline workflows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[web,dev]"
      - run: python -m ruff check src tests benchmarks
      - run: node --check src/biosbom_agentkg/web/static/app.js
      - run: node --test tests/web_state.test.cjs
      - run: python -m pytest -q
      - run: biosbom-agentkg run --case examples/rnaseq-case.json --output runs/ci
      - run: biosbom-agentkg verify runs/ci
      - run: biosbom-agentkg evaluate --case examples/rnaseq-case.json --output runs/evaluation --seeds 1
